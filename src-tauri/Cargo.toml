[package]
name         = "ask3lad-testdrive3"
version      = "3.0.0-alpha.21.1"
description  = "Ask3lad Test Drive 3.0 - macOS"
authors      = ["Ask3lad"]
edition      = "2021"
rust-version = "1.77"

[lib]
name       = "testdrive3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2" }
tauri-plugin-dialog  = "2"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
thiserror            = "1"
chrono               = { version = "0.4", features = ["clock"] }
urlencoding          = "2"
mime_guess           = "2"

[features]
default = []

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
