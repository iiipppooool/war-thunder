name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The backend's own logic is platform-independent and tested on Linux;
      # only bundling needs a Mac.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # Catch startup panics (bad plugin/config wiring) before a Mac build.
      # A release .dmg can bundle fine and still abort on launch.
      - name: Smoke test - app survives startup
        working-directory: src-tauri
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          cargo build
          export DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1
          Xvfb :99 -screen 0 1280x900x24 >/dev/null 2>&1 &
          sleep 3
          ./target/debug/ask3lad-testdrive3 > app.log 2>&1 &
          APP=$!
          for i in $(seq 1 15); do
            sleep 1
            if ! kill -0 $APP 2>/dev/null; then
              echo "::error::App exited during startup"; cat app.log; exit 1
            fi
          done
          echo "App survived 15s of startup"
          kill $APP || true

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
